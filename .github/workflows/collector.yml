name: Telegram Collector & Deploy

on:
  schedule:
    # اجرا هر 10 دقیقه یک‌بار به صورت کاملاً خودکار
    - cron: '*/10 * * * *'
  workflow_dispatch:
    # دکمه اجرای دستی از داخل داشبورد گیت‌هاب
  push:
    branches:
      - main
    paths:
      - 'config/**'
      - 'collector/**'
      - 'web/**'

# جلوگیری از تداخل اجراهای هم‌زمان
concurrency:
  group: telegram-collector
  cancel-in-progress: false

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: دریافت کد مخزن (Checkout)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: راه‌اندازی مفسر پایتون
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: نصب وابستگی‌های پایتون
        run: |
          python -m pip install --upgrade pip
          pip install -r collector/requirements.txt

      - name: اجرای اسکریپت جمع‌آوری پست‌ها و فشرده‌سازی مدیا
        run: |
          python collector/main.py

      - name: آماده‌سازی پوشه استقرار (Dist)
        run: |
          mkdir -p dist
          # کپی فایل‌های فرانت‌اند مینی‌اپ
          cp -r web/* dist/
          # کپی داده‌های استخراج شده
          cp -r data dist/
          # کپی عکس‌های بهینه‌شده
          if [ -d "media" ]; then
            cp -r media dist/
          fi

      - name: استقرار امن روی شاخه Orphan بدون تاریخچه (Zero-Bloat Deploy)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
